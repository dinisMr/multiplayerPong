<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pong Online - The Dinis</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { 
            background: #1a1a1a; 
            color: white; 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden; 
        }
        canvas { 
            border: 4px solid #fff; 
            background: #000; 
            box-shadow: 0 0 20px rgba(255,255,255,0.2); 
            max-width: 95vw; 
            max-height: 70vh; 
        }
        .status { 
            margin-bottom: 10px; 
            font-size: 1.2rem; 
            font-weight: bold; 
            transition: all 0.3s;
        }
    </style>
</head>
<body>
    <div class="status" id="status">A ligar ao Umbrel...</div>
    <canvas id="pong" width="600" height="400"></canvas>

    <script>
        const canvas = document.getElementById("pong");
        const ctx = canvas.getContext("2d");
        const statusEl = document.getElementById("status");

        // LIGAÇÃO AO TEU TÚNEL CLOUDFLARE
        const socket = io("https://multiplayerpong.thedinis.com");

        let players = {};
        let ball = { x: 300, y: 200 };
        let myRole = null;

        // Eventos de Ligação
        socket.on("connect", () => {
            statusEl.innerText = "Ligado ao Umbrel! À espera de adversário...";
            statusEl.style.color = "#4CAF50";
        });

        socket.on("connect_error", () => {
            statusEl.innerText = "Erro de ligação ao Umbrel (Verifica o Túnel)";
            statusEl.style.color = "#ff4444";
        });

        socket.on("playerRole", (role) => {
            myRole = role;
            statusEl.innerText = "Ligado! És o Jogador " + myRole;
        });

        // Captura de Movimento
        function move(e) {
            let rect = canvas.getBoundingClientRect();
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            let scaleY = canvas.height / rect.height;
            let newY = (clientY - rect.top) * scaleY - 50;

            // Envia a posição Y para o servidor no Umbrel
            socket.emit("paddleMove", { y: newY });
        }

        canvas.addEventListener("mousemove", move);
        canvas.addEventListener("touchmove", (e) => { e.preventDefault(); move(e); }, { passive: false });

        // RECEBER ESTADO DO JOGO (O motor que faz a bola mexer)
        socket.on("gameState", (data) => {
            players = data.players; // Atualiza raquetes de todos
            ball.x = data.ball.x;   // Atualiza posição X da bola
            ball.y = data.ball.y;   // Atualiza posição Y da bola
        });

        // Função de Desenho (60fps)
        function draw() {
            // Limpar o fundo
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Linha central tracejada
            ctx.setLineDash([10, 10]);
            ctx.strokeStyle = "rgba(255,255,255,0.5)";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(canvas.width/2, 0);
            ctx.lineTo(canvas.width/2, canvas.height);
            ctx.stroke();

            // Desenhar Raquetes
            ctx.fillStyle = "#fff";
            ctx.setLineDash([]); // Remover tracejado para as raquetes
            
            for (let id in players) {
                let p = players[id];
                // Se for papel 1 desenha à esquerda, papel 2 desenha à direita
                let xPos = (p.role === 1) ? 10 : 580;
                ctx.fillRect(xPos, p.y, 10, 100);
            }

            // Desenhar a Bola (na posição vinda do Umbrel)
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, 8, 0, Math.PI*2);
            ctx.fill();

            requestAnimationFrame(draw);
        }

        // Iniciar o loop de desenho
        draw();
    </script>
</body>
</html>
