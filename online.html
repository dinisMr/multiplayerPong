<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pong Online - The Dinis</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { background: #1a1a1a; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        canvas { border: 4px solid #fff; background: #000; box-shadow: 0 0 20px rgba(255,255,255,0.2); max-width: 95vw; max-height: 70vh; }
        .status { margin-bottom: 10px; font-size: 1.2rem; font-weight: bold; }
    </style>
</head>
<body>
    <div class="status" id="status">A ligar ao Umbrel...</div>
    <canvas id="pong" width="600" height="400"></canvas>

    <script>
        const canvas = document.getElementById("pong");
        const ctx = canvas.getContext("2d");
        const statusEl = document.getElementById("status");

        // LIGAÇÃO AO TEU TÚNEL (multiplayerpong.thedinis.com)
        // Certifica-te que este é o endereço configurado no teu Cloudflare Tunnel
        const socket = io("https://multiplayerpong.thedinis.com");

        let player1 = { y: 150 };
        let player2 = { y: 150 };
        let ball = { x: 300, y: 200 };
        let myRole = null;

        socket.on("connect", () => {
            statusEl.innerText = "Ligado ao Umbrel! À espera de adversário...";
            statusEl.style.color = "#4CAF50";
        });

        socket.on("connect_error", (error) => {
            statusEl.innerText = "Erro de ligação ao servidor (502/Porta Fechada)";
            statusEl.style.color = "#ff4444";
        });

        socket.on("playerRole", (role) => {
            myRole = role;
            statusEl.innerText = "Ligado! És o Jogador " + myRole;
        });

        // Função de movimento (Rato e Toque)
        function move(e) {
            let rect = canvas.getBoundingClientRect();
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            let scaleY = canvas.height / rect.height;
            let newY = (clientY - rect.top) * scaleY - 50;

            // Só controlamos a nossa raquete localmente para não haver lag
            if (myRole === 1) player1.y = newY;
            else if (myRole === 2) player2.y = newY;

            // Envia a posição para o Umbrel
            socket.emit("paddleMove", { y: newY });
        }

        canvas.addEventListener("mousemove", move);
        canvas.addEventListener("touchmove", (e) => { e.preventDefault(); move(e); }, { passive: false });

        // Recebe posições de TODOS os jogadores do servidor
        socket.on("updatePlayers", (playersData) => {
            const ids = Object.keys(playersData);
            ids.forEach(id => {
                if (id !== socket.id) {
                    // O adversário é quem não tem o nosso ID
                    player2.y = playersData[id].y;
                } else {
                    player1.y = playersData[id].y;
                }
            });
        });

        function draw() {
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Linha central
            ctx.setLineDash([10, 10]);
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 2;
            ctx.strokeRect(canvas.width/2, 0, 0, canvas.height);

            // Raquetes
            ctx.fillStyle = "#fff";
            ctx.fillRect(10, player1.y, 10, 100);  // Esquerda
            ctx.fillRect(580, player2.y, 10, 100); // Direita

            // Bola
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, 8, 0, Math.PI*2);
            ctx.fill();

            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
